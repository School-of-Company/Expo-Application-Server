name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      SPRING_PROFILES_ACTIVE: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
      - name: Start PostgreSQL and Redis
        run: |
          cp .env.example .env
          docker compose up -d --wait
      - name: Build, test and check formatting
        run: |
          (
            sleep 480
            jps -l | while read -r pid main; do
              if [[ "$main" == *GradleWorkerMain ]]; then
                jcmd "$pid" Thread.print || true
              fi
            done
            for db in $(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}'); do
              docker exec "$db" psql -U test -d test -c \
                "SELECT pid,state,wait_event_type,wait_event,pg_blocking_pids(pid),left(query,200) FROM pg_stat_activity WHERE datname='test';" || true
            done
          ) &
          diagnostics_pid=$!
          trap 'kill "$diagnostics_pid" 2>/dev/null || true' EXIT
          ./gradlew build ktlintCheck spotlessCheck --build-cache -PciTestShard=${{ matrix.shard }} --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.shard }}
          path: |
            build/reports/tests/test
            build/test-results/test/*.xml
          retention-days: 7
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down
  build:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check both test shards
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
