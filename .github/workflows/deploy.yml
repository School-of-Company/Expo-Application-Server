name: Deploy

# main 에 머지되면 배포한다 (glink.kr ~/expo, 개발/운영 구분 없는 단일 환경)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-application-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      SVC: application
      DEPLOY_ENV: prod # 서버는 단일 환경이라 무시한다 (deploy.sh 인자 호환용)
      REMOTE_ROOT: /srv/users/projects/2026/team1/expo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # 테스트용 DB 는 기존 CI 와 같이 compose 로 띄운다.
      - name: Start test services
        run: |
          cp .env.example .env
          docker compose up -d --wait

      # build = 테스트·린트(ktlint/spotless) + bootJar. 테스트가 실패하면 업로드 전에 멈춘다.
      - name: Build and test
        # 테스트가 compose 로 띄운 로컬 DB/Redis 를 쓰도록 local 프로필로 실행 (기존 CI 와 동일).
        # 서버에서 실행할 때는 이 값이 쓰이지 않는다.
        env:
          SPRING_PROFILES_ACTIVE: local
        run: ./gradlew build --no-daemon

      - name: Stop test services
        if: always()
        run: docker compose down

      - name: Package
        run: |
          JAR="$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -n1 || true)"
          if [ -z "$JAR" ]; then
            echo "::error::build/libs 에 실행 가능한 bootJar 가 없습니다"
            ls -la build/libs || true
            exit 1
          fi
          cp "$JAR" app.jar
          tar czf release.tar.gz app.jar

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EXPO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EXPO_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and deploy
        env:
          HOST: ${{ vars.EXPO_SSH_HOST }}
          PORT: ${{ vars.EXPO_SSH_PORT }}
          USER: ${{ vars.EXPO_SSH_USER }}
        run: |
          REL="${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"
          scp -P "$PORT" release.tar.gz "$USER@$HOST:$REMOTE_ROOT/app/$SVC/incoming/$REL.tar.gz"
          ssh -p "$PORT" "$USER@$HOST" "$REMOTE_ROOT/bin/deploy.sh $SVC $DEPLOY_ENV $REL"
