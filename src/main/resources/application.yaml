spring:
  application:
    name: expo-application-server
  main:
    # stdout은 JSON 로그 줄만 둔다(배너는 여러 줄 평문이라 로그 수집기가 줄마다 깨진 로그로 받는다)
    banner-mode: "off"
  datasource:
    hikari:
      maximum-pool-size: 15
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

logging:
  # 요청마다 접근 로그 한 줄(module HttpAccess, `GET /path/{id} status: 200 (12ms)`). 쿼리·헤더·쿠키·본문은 남기지 않는다.
  http-access:
    enabled: ${LOGGING_HTTP_ACCESS_ENABLED:true}

springdoc:
  api-docs:
    path: /application/v3/api-docs
    enabled: ${swagger.enabled}
  swagger-ui:
    path: /application/swagger-ui.html
    enabled: ${swagger.enabled}

swagger:
  enabled: ${SWAGGER_ENABLED:false}
  include-internal: ${SWAGGER_INCLUDE_INTERNAL:false}

application:
  legacy-trainee-attribution:
    enabled: ${APPLICATION_LEGACY_TRAINEE_ATTRIBUTION_ENABLED:false}
  promotions:
    enabled: ${APPLICATION_PROMOTIONS_ENABLED:false}
    bootstrap-servers: ${APPLICATION_PROMOTIONS_BOOTSTRAP_SERVERS:}
    publish-from: ${APPLICATION_PROMOTIONS_PUBLISH_FROM:}
  # #308 신청 결과 문자(Notification #110). 꺼져 있으면 outbox에 아무것도 쌓지 않는다. 켜기 전에 Notification 소비자를 먼저 배포하고
  # expo-ids로 테스트 박람회에 한정해 검증한다(docs/application-result-notifications.md). publish-from은 고정된 활성화 시각이다.
  notifications:
    enabled: ${APPLICATION_NOTIFICATIONS_ENABLED:false}
    bootstrap-servers: ${APPLICATION_NOTIFICATIONS_BOOTSTRAP_SERVERS:}
    publish-from: ${APPLICATION_NOTIFICATIONS_PUBLISH_FROM:}
    expo-ids: ${APPLICATION_NOTIFICATIONS_EXPO_IDS:}
  # #144 participation offers. Off keeps the pre-#144 automatic promotion; turn on only after Notification's offer
  # consumer and the Client offer page are deployed (docs/promotion-offer.md).
  promotion-offers:
    enabled: ${APPLICATION_PROMOTION_OFFERS_ENABLED:false}
    bootstrap-servers: ${APPLICATION_PROMOTION_OFFERS_BOOTSTRAP_SERVERS:}
    response-url: ${APPLICATION_PROMOTION_OFFERS_RESPONSE_URL:}
  internal-token: ${APPLICATION_INTERNAL_TOKEN:}
  # Expo `expo.expo.changed` 로컬 프로젝션(docs/expo-projection.md). 꺼져 있으면 소비자가 뜨지 않고 Expo를 예전처럼 동기 조회한다.
  # 켜면 관리자 그룹 발송의 박람회 제목만 프로젝션에서 읽고, 없으면 동기 조회로 넘어간다. 신청 기간·취소 기한은 항상 동기 조회다.
  expo-projection:
    enabled: ${KAFKA_EXPO_PROJECTION_ENABLED:false}
    bootstrap-servers: ${KAFKA_EXPO_PROJECTION_BOOTSTRAP_SERVERS:}
    group-id: ${KAFKA_EXPO_PROJECTION_GROUP_ID:expo-application-server.expo-changed}
  # #162 관리자 신청 현황 변경 SSE(docs/admin-data-change-events.md). Gateway의 text/event-stream 전달을 확인한 뒤 켠다.
  admin-events:
    enabled: ${APPLICATION_ADMIN_EVENTS_ENABLED:false}
    max-connections: ${APPLICATION_ADMIN_EVENTS_MAX_CONNECTIONS:500}
    max-connections-per-expo: ${APPLICATION_ADMIN_EVENTS_MAX_CONNECTIONS_PER_EXPO:50}
    connection-lifetime: ${APPLICATION_ADMIN_EVENTS_CONNECTION_LIFETIME:PT30M}
    heartbeat-interval: ${APPLICATION_ADMIN_EVENTS_HEARTBEAT_INTERVAL:PT25S}
  admin-group-messaging:
    expo-url: ${APPLICATION_ADMIN_GROUP_MESSAGE_EXPO_URL:}
    user-url: ${APPLICATION_ADMIN_GROUP_MESSAGE_USER_URL:}
    notification-url: ${APPLICATION_ADMIN_GROUP_MESSAGE_NOTIFICATION_URL:}
    expo-internal-token: ${APPLICATION_ADMIN_GROUP_MESSAGE_EXPO_INTERNAL_TOKEN:}
    user-internal-token: ${APPLICATION_ADMIN_GROUP_MESSAGE_USER_INTERNAL_TOKEN:}
    notification-internal-token: ${APPLICATION_ADMIN_GROUP_MESSAGE_NOTIFICATION_INTERNAL_TOKEN:}
  owner:
    session-cookie-name: ${PARTICIPANT_SESSION_COOKIE_NAME:PARTICIPANT_SESSION}
    cancellation-recovery-delay-ms: ${APPLICATION_OWNER_CANCELLATION_RECOVERY_DELAY_MS:60000}
  program-sessions:
    enabled: ${APPLICATION_PROGRAM_SESSIONS_ENABLED:false}
  attendance:
    enabled: ${APPLICATION_ATTENDANCE_ENABLED:false}
    url: ${APPLICATION_ATTENDANCE_URL:}
    internal-token: ${APPLICATION_ATTENDANCE_INTERNAL_TOKEN:}
  page-views:
    visitor-hash-retention-hours: ${APPLICATION_PAGE_VIEW_VISITOR_HASH_RETENTION_HOURS:48}
  field-visits:
    enabled: ${APPLICATION_FIELD_VISITS_ENABLED:false}
    recovery-delay-ms: ${APPLICATION_FIELD_VISITS_RECOVERY_DELAY_MS:60000}
  registration:
    enabled: ${APPLICATION_REGISTRATION_ENABLED:false}
    waitlist-intake-enabled: ${APPLICATION_PREREGISTER_WAITLIST_INTAKE_ENABLED:false}
    reservation-review:
      max-attempts: ${APPLICATION_RESERVATION_REVIEW_MAX_ATTEMPTS:40}
      max-age-minutes: ${APPLICATION_RESERVATION_REVIEW_MAX_AGE_MINUTES:60}
    expo-url: ${APPLICATION_REGISTRATION_EXPO_URL:}
    form-url: ${APPLICATION_REGISTRATION_FORM_URL:}
    user-url: ${APPLICATION_REGISTRATION_USER_URL:}
    expo-internal-token: ${APPLICATION_REGISTRATION_EXPO_INTERNAL_TOKEN:}
    form-internal-token: ${APPLICATION_REGISTRATION_FORM_INTERNAL_TOKEN:}
    user-internal-token: ${APPLICATION_REGISTRATION_USER_INTERNAL_TOKEN:}

management:
  metrics:
    distribution:
      # GC 일시 정지 p99를 구하려고 jvm_gc_pause_seconds에 고정 경계 10개(+Inf 포함 버킷 11개)를 둔다(Expo-Monitoring #34).
      # percentiles-histogram은 시리즈당 버킷이 약 69개라 카디널리티가 커서 쓰지 않는다
      slo:
        jvm.gc.pause: 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s
