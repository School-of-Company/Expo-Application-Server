spring:
  application:
    name: expo-application-server
  datasource:
    hikari:
      maximum-pool-size: 15
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    path: /application/v3/api-docs
    enabled: ${swagger.enabled}
  swagger-ui:
    path: /application/swagger-ui.html
    enabled: ${swagger.enabled}

swagger:
  enabled: ${SWAGGER_ENABLED:false}
  include-internal: ${SWAGGER_INCLUDE_INTERNAL:false}

application:
  promotions:
    enabled: ${APPLICATION_PROMOTIONS_ENABLED:false}
    bootstrap-servers: ${APPLICATION_PROMOTIONS_BOOTSTRAP_SERVERS:}
    publish-from: ${APPLICATION_PROMOTIONS_PUBLISH_FROM:}
  internal-token: ${APPLICATION_INTERNAL_TOKEN:}
  admin-group-messaging:
    expo-url: ${APPLICATION_ADMIN_GROUP_MESSAGE_EXPO_URL:}
    user-url: ${APPLICATION_ADMIN_GROUP_MESSAGE_USER_URL:}
    notification-url: ${APPLICATION_ADMIN_GROUP_MESSAGE_NOTIFICATION_URL:}
    expo-internal-token: ${APPLICATION_ADMIN_GROUP_MESSAGE_EXPO_INTERNAL_TOKEN:}
    user-internal-token: ${APPLICATION_ADMIN_GROUP_MESSAGE_USER_INTERNAL_TOKEN:}
    notification-internal-token: ${APPLICATION_ADMIN_GROUP_MESSAGE_NOTIFICATION_INTERNAL_TOKEN:}
  owner:
    session-cookie-name: ${PARTICIPANT_SESSION_COOKIE_NAME:PARTICIPANT_SESSION}
    cancellation-recovery-delay-ms: ${APPLICATION_OWNER_CANCELLATION_RECOVERY_DELAY_MS:60000}
  program-sessions:
    enabled: ${APPLICATION_PROGRAM_SESSIONS_ENABLED:false}
  attendance:
    enabled: ${APPLICATION_ATTENDANCE_ENABLED:false}
    url: ${APPLICATION_ATTENDANCE_URL:}
    internal-token: ${APPLICATION_ATTENDANCE_INTERNAL_TOKEN:}
  registration:
    enabled: ${APPLICATION_REGISTRATION_ENABLED:false}
    waitlist-intake-enabled: ${APPLICATION_PREREGISTER_WAITLIST_INTAKE_ENABLED:false}
    expo-url: ${APPLICATION_REGISTRATION_EXPO_URL:}
    form-url: ${APPLICATION_REGISTRATION_FORM_URL:}
    user-url: ${APPLICATION_REGISTRATION_USER_URL:}
    expo-internal-token: ${APPLICATION_REGISTRATION_EXPO_INTERNAL_TOKEN:}
    form-internal-token: ${APPLICATION_REGISTRATION_FORM_INTERNAL_TOKEN:}
    user-internal-token: ${APPLICATION_REGISTRATION_USER_INTERNAL_TOKEN:}
