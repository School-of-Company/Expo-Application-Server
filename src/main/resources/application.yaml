spring:
  application:
    name: expo-application-server
  datasource:
    hikari:
      maximum-pool-size: 15
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

application:
  internal-token: ${APPLICATION_INTERNAL_TOKEN:}
  registration:
    enabled: ${APPLICATION_REGISTRATION_ENABLED:false}
    expo-url: ${APPLICATION_REGISTRATION_EXPO_URL:}
    form-url: ${APPLICATION_REGISTRATION_FORM_URL:}
    user-url: ${APPLICATION_REGISTRATION_USER_URL:}
